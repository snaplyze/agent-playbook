name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Новый коммит в PR отменяет устаревший прогон. На ветке прогоны идут по очереди и не прерываются,
# поэтому страница не откатится на старый коммит; из ожидающих остается последний.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 --version && node --version
      - run: python3 scripts/build.py --check --site "$RUNNER_TEMP/site" --parity-cases "$RUNNER_TEMP/cases.json"
      - run: node scripts/parity.mjs "$RUNNER_TEMP/site/index.html" "$RUNNER_TEMP/cases.json"
      - run: node scripts/smoke.mjs "$RUNNER_TEMP/site/index.html" "$RUNNER_TEMP/cases.json"
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
