name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/build.py --check --site "$RUNNER_TEMP/site" --parity-cases "$RUNNER_TEMP/cases.json"
      - run: node scripts/parity.mjs "$RUNNER_TEMP/site/index.html" "$RUNNER_TEMP/cases.json"
