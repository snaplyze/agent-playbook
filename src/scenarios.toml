# Сценарии и их параметры. Единственный источник для сборки prompts/, таблиц README и страницы.
#
# Параметр с option — выбор одного варианта; первый вариант — по умолчанию.
#   line   — текст строки в промпте после «- <key>: »;
#   input  — вариант просит дописать значение: подсказка поля, в line — {input};
#   choice — второй выбор для варианта, в line — {choice}; первый элемент — по умолчанию.
# Параметр с choices — выбор нескольких; default = "all" или "none".
#   all, none, some — текст строки, когда отмечено все, ничего или часть;
#   подстановки: {all} — все варианты, {selected} — отмеченные, {rest} — неотмеченные.

[[scenario]]
file = "00-setup.md"
name = "Подготовка проекта"
when = "Один раз в проекте, по желанию: чтобы агенты сразу знали команды, место плана и решения владельца"
result = "Короткий раздел «Сведения о проекте» в `AGENTS.md`, загрузка подтверждена в каждом клиенте"
never = "Не трогает продукт и CI, план только дополняет задачами; общие правила агентов в `AGENTS.md` не копирует"

  [[scenario.param]]
  key = "CI"
  help = "Записывается в сведения о проекте. «По обнаружению» оставляет выбор агенту; явный вариант — решение владельца, и отступление от него агент исправляет, а не только отмечает. Код из недоверенных источников на self-hosted не попадает в любом случае."

    [[scenario.param.option]]
    label = "По обнаружению"
    line = "по обнаружению — по умолчанию hosted, self-hosted для подходящих заданий, если раннеры доступны."

    [[scenario.param.option]]
    label = "Только hosted"
    line = "только hosted — все задания на hosted-раннерах платформы, даже если self-hosted доступны."

    [[scenario.param.option]]
    label = "Self-hosted для подходящих заданий"
    line = "self-hosted для подходящих заданий — решение владельца: задания, подходящие по меткам, ОС, архитектуре и возможностям, идут на self-hosted, остальные на hosted; подходящее задание на hosted — дефект для исправления, а не только находка."

    [[scenario.param.option]]
    label = "Свое правило…"
    input = "например: self-hosted Linux x64 для сборки, остальное — hosted"
    line = "{input} — решение владельца."

  [[scenario.param]]
  key = "Доступ"
  help = "Широкий доступ — выбор владельца, а не безопасный стандарт."

    [[scenario.param.option]]
    label = "Не менять"
    line = "не менять — разрешения агентов не расширяй, только проверь их и сообщи; запреты на чтение секретов из шага 6 все равно добавь."

    [[scenario.param.option]]
    label = "Полный"
    line = "полный — настрой широкий неинтерактивный доступ агента на уровне проекта там, где клиент берет его из проектных настроек; если режим задается только при запуске, дай владельцу точную команду. Это выбор владельца, а не безопасный стандарт."

  [[scenario.param]]
  key = "Оркестрация"
  help = "Подагенты ускоряют независимые части работы. Без установки агент только проверяет, что уже настроено."

    [[scenario.param.option]]
    label = "Только проверить"
    line = "только проверить — выясни, какие подагенты и роли доступны, и ничего не устанавливай; ограничение вложенности из шага 5 все равно настрой."

    [[scenario.param.option]]
    label = "Установить…"
    input = "репозиторий или путь установщика"
    choice = ["проект", "пользователь"]
    line = "установить из {input} в область «{choice}» — исходник скачай во временный каталог вне проекта и удали после установки."

[[scenario]]
file = "01-audit.md"
name = "Аудит"
when = "Нужна проверка состояния и очередь исправлений"
result = "Находки с доказательствами, приоритетом, решением и приемкой — прямо в плане"
never = "Не меняет код, тесты и CI"

  [[scenario.param]]
  key = "Области"
  help = "По умолчанию аудит охватывает все области. Снимите лишние, чтобы сфокусировать его."
  choices = ["архитектура", "безопасность", "данные", "производительность", "тесты", "сборка и доставка", "документация"]
  default = "all"
  all = "все — {all}."
  none = "все — {all}."
  some = "{selected} — остальные области ({rest}) не исследуй, но явные критичные дефекты, замеченные попутно, запиши."

[[scenario]]
file = "02-plan.md"
name = "Порядок в плане"
when = "План раздут, статусы расходятся, агент зацикливается"
result = "Компактный реестр, цельные задачи с приемкой"
never = "Не выдает правку плана за ускорение продукта"

[[scenario]]
file = "03-execute.md"
name = "Выполнение плана"
when = "Довести до результата весь план, один аудит или выбранные задачи"
result = "Каждая задача проверена и слита в основную ветку или назван конкретный остаток"
never = "Не придумывает новый объем и не полирует после приемки"

  [[scenario.param]]
  key = "Объем"
  help = "Что именно довести до результата."

    [[scenario.param.option]]
    label = "Весь план"
    line = "весь план — все согласованные задачи и обязательные подпланы."

    [[scenario.param.option]]
    label = "Аудит…"
    input = "название или дата аудита"
    line = "аудит {input} — все ID этого аудита и их необходимые зависимости; остальной план не выполняй."

    [[scenario.param.option]]
    label = "Выбранные задачи…"
    input = "ID через запятую, например: A-03, A-07"
    line = "задачи {input} — только они и их необходимые зависимости."

[[scenario]]
file = "04-publish.md"
name = "Публикация"
when = "Первый импорт или полная сверка с удаленным репозиторием"
result = "Доказанная полнота доставленного состава в основной ветке"
never = "Не оптимизирует продукт и не переносит хостинг"

  [[scenario.param]]
  key = "Разрешено"
  help = "Действия сверх обычной публикации через PR. Неотмеченные агент только подготовит и предложит вам."
  choices = ["создание репозитория", "создание основной ветки", "первичная загрузка", "смена видимости", "смена доступов", "другие ветки и теги", "перенос wiki", "перенос задач", "перенос релизов", "деплой"]
  default = "none"
  all = "{selected} — все действия сверх обычной публикации разрешены."
  none = "ничего сверх обычной публикации — {all} только подготовь и предложи владельцу."
  some = "{selected} — остальное сверх обычной публикации ({rest}) только подготовь и предложи владельцу."
