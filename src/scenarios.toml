# Сценарии и их параметры. Единственный источник для сборки prompts/, таблиц README и страницы.
#
# Параметр с option — выбор одного варианта; первый вариант — по умолчанию.
#   line   — текст строки в промпте после «- <key>: »;
#   input  — вариант просит дописать значение: подсказка поля, в line — {input};
# Параметр с choices — выбор нескольких; default = "all" или "none".
#   all, none, some — текст строки, когда отмечено все, ничего или часть;
#   подстановки: {all} — все варианты, {selected} — отмеченные, {rest} — неотмеченные.

[[scenario]]
file = "00-setup.md"
name = "Подготовка проекта"
when = "Один раз в проекте, по желанию: чтобы агенты сразу знали команды, место плана и решения владельца"
result = "Короткий раздел «Сведения о проекте» в `AGENTS.md`; загрузка в каждом используемом клиенте проверена или помечена NOT_TESTED"
never = "Не трогает продукт и CI; в репозиторий пишет только инструкции агентов и задачи плана, настройки клиентов не меняет, кроме выбранной установки оркестрации; общие правила агентов в `AGENTS.md` не копирует"

  [[scenario.param]]
  key = "CI"
  help = "Записывается в сведения о проекте. «По обнаружению» оставляет выбор агенту; явный вариант — решение владельца, и расхождение с ним подготовка проекта записывает задачей плана, не меняя конфигурации CI, а исправляет промпт «Выполнение плана». Код из недоверенных источников на self-hosted не попадает в любом случае."

    [[scenario.param.option]]
    label = "По обнаружению"
    line = "по обнаружению — по умолчанию hosted, self-hosted для подходящих заданий, если раннеры доступны."

    [[scenario.param.option]]
    label = "Только hosted"
    line = "только hosted — решение владельца: все задания на hosted-раннерах платформы, даже если self-hosted доступны."

    [[scenario.param.option]]
    label = "Self-hosted для подходящих заданий"
    line = "self-hosted для подходящих заданий — решение владельца: задания, подходящие по меткам, ОС, архитектуре и возможностям, идут на self-hosted, остальные на hosted; подходящее задание на hosted — дефект для исправления."

    [[scenario.param.option]]
    label = "Свое правило…"
    input = "например: self-hosted Linux x64 для сборки, остальное — hosted"
    line = "{input} — решение владельца."

  [[scenario.param]]
  key = "Доступ"
  help = "Агент не меняет настройки клиентов — ни в репозитории, ни у пользователя: проверяет права агентов и описывает их в сведениях о проекте. «Полный» дополнительно выдает вам точные настройки широкого доступа и запретов на чтение секретов — применяете их вы. Широкий доступ — выбор владельца, а не безопасный стандарт."

    [[scenario.param.option]]
    label = "Проверить, ничего не меняя"
    line = "проверить, ничего не меняя — выясни права по шагу 6; если чтение секретов не запрещено, дай владельцу точную настройку запретов."

    [[scenario.param.option]]
    label = "Полный"
    line = "полный — владелец хочет широкий неинтерактивный доступ: дай ему точные пользовательские настройки или команду запуска для него вместе с запретами на чтение секретов, а сам их не записывай."

  [[scenario.param]]
  key = "Оркестрация"
  help = "Подагенты ускоряют независимые части работы. «Проверить, ничего не меняя» ищет оркестрацию в проекте и у пользователя — роли подагентов, навыки, расширения — и только описывает найденное в сведениях о проекте, не предлагая его перенастраивать. «Установить глобально» ставит ее в область пользователя, а не в репозиторий, и это затрагивает все проекты пользователя."

    [[scenario.param.option]]
    label = "Проверить, ничего не меняя"
    line = "проверить, ничего не меняя — найди оркестрацию по шагу 5, в том числе глобальную, и запиши найденное; ничего не устанавливай и не настраивай ни в проекте, ни у пользователя; если подагентов нет, отметь это в итоге."

    [[scenario.param.option]]
    label = "Установить глобально…"
    input = "репозиторий или путь установщика"
    line = "установить глобально из {input} — только в область пользователя; установленное с той же ссылкой не переустанавливай. Скачай исходник во временный каталог вне проекта, закрепи для сведений о проекте неизменяемой ссылкой — SHA коммита для Git, иначе хешем содержимого — и выясни, что и куда установщик добавит, ссылается ли установленное на исходник и что будет исполнять автоматически: хуки, команды, серверы инструментов, права. Ставит только в проект или ссылается на исходник — не устанавливай, а дай владельцу команду установки; выходящее за поручение устанавливай после подтверждения владельца, продолжая остальное. Запускай установщик из временного каталога; затем верни в проекте только измененные им пути, чистые до установки, а исходник удали."

[[scenario]]
file = "01-audit.md"
name = "Аудит"
when = "Нужна проверка состояния и очередь исправлений"
result = "Находки с доказательствами, приоритетом, решением и приемкой — прямо в плане"
never = "Не меняет код, тесты, CI и настройки агентов"

  [[scenario.param]]
  key = "Области"
  help = "По умолчанию аудит охватывает все области. Снимите лишние, чтобы сфокусировать его; если снять все отметки, аудит охватит все области."
  choices = ["архитектура", "безопасность", "данные", "производительность", "тесты", "сборка и доставка", "документация"]
  default = "all"
  all = "все — {all}."
  none = "все — {all}."
  some = "{selected} — остальные области ({rest}) не исследуй, но явные критичные дефекты, замеченные попутно, запиши."

[[scenario]]
file = "02-plan.md"
name = "Порядок в плане"
when = "План раздут, статусы расходятся, агент зацикливается или план нужно вести и в задачах и вехах трекера"
result = "Компактный реестр, цельные задачи с приемкой; по выбору — задачи и вехи трекера как копия плана"
never = "Не меняет код, тесты, CI, настройки и инструкции агентов, закрывает в трекере только задачи снятых и слитых ID и не выдает правку плана за ускорение продукта"

  [[scenario.param]]
  key = "Трекер"
  help = "Задачи и вехи (milestones) трекера как копия плана: людям там видны этапы и ход работы, туда можно добавлять задачи и правки — промпты перенесут их в план. План в репозитории остается реестром и записью хода: агент сверяет его с трекером перед выбором задач и пишет ход сначала в план. Связь отмечается строкой «Трекер» в начале плана, и, раз созданную, ее ведут все промпты при любом варианте."

    [[scenario.param.option]]
    label = "Оставить как есть"
    line = "оставить как есть — новую связь с трекером не создавай; если в начале плана уже есть строка «Трекер», сверь и веди связь по правилу 15."

    [[scenario.param.option]]
    label = "Связать с задачами и вехами"
    line = "связать с задачами и вехами — свяжи план с трекером по шагу 8; если связь уже есть, сверь и дополни ее."

[[scenario]]
file = "03-execute.md"
name = "Выполнение плана"
when = "Довести до результата весь план, один аудит или выбранные задачи"
result = "Каждая задача проверена и слита в основную ветку или назван конкретный остаток"
never = "Не придумывает новый объем, не меняет настройки агентов без прямого указания и не полирует после приемки"

  [[scenario.param]]
  key = "Объем"
  help = "Что именно довести до результата. Агент сам сливает изменения в основную ветку, даже если слияние запускает настроенные в проекте деплой или релиз."

    [[scenario.param.option]]
    label = "Весь план"
    line = "весь план — все задачи плана и обязательные подпланы с их необходимыми зависимостями, кроме гипотез и задач, отложенных или отмененных владельцем; задача, которой нужна отложенная, — остаток."

    [[scenario.param.option]]
    label = "Веха…"
    input = "название вехи трекера или этапа плана"
    line = "веха {input} — все задачи плана этого этапа или вехи трекера и их необходимые зависимости, кроме гипотез; остальной план не выполняй."

    [[scenario.param.option]]
    label = "Аудит…"
    input = "название или дата аудита"
    line = "аудит {input} — все задачи плана из раздела или с отметкой этого аудита и их необходимые зависимости, кроме гипотез, пока они не стали задачами плана; остальной план не выполняй."

    [[scenario.param.option]]
    label = "Выбранные задачи…"
    input = "ID плана или номера задач трекера через запятую, например: A-03, #12"
    line = "задачи {input} — по ID плана или номеру связанной задачи трекера; только они и их необходимые зависимости."

[[scenario]]
file = "04-publish.md"
name = "Публикация"
when = "Первый импорт или полная сверка с удаленным репозиторием"
result = "Доказанная полнота доставленного состава в основной ветке"
never = "Не оптимизирует продукт и сверх обычной публикации делает только отмеченное в «Разрешено»"

  [[scenario.param]]
  key = "Разрешено"
  help = "Действия сверх обычной публикации через PR. Для неотмеченных агент опишет вам, зачем они нужны и что сделать, и ничего не создаст на сервере."
  choices = ["создание репозитория", "создание основной ветки", "первичная загрузка", "смена видимости", "смена доступов", "другие ветки и теги", "перенос wiki", "перенос задач трекера", "перенос релизов", "деплой"]
  default = "none"
  all = "{selected} — эти действия разрешены; переписывание истории, force push, удаление серверных refs и обход защит в них не входят."
  none = "ничего сверх обычной публикации. Если для полной публикации понадобится одно из действий ({all}), не выполняй его: опиши владельцу, зачем оно и что сделать, без файлов и объектов на сервере."
  some = "{selected} — эти действия разрешены. Если для полной публикации понадобится одно из остальных ({rest}), не выполняй его: опиши владельцу, зачем оно и что сделать, без файлов и объектов на сервере."
